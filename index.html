<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>
<style>
  :root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-light:#eef2ff;
    --bg:#f4f6fb;
    --muted:#64748b;
    --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:#1e293b;
  }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:10px 16px 0;
    flex-wrap:wrap;
  }
  .title-row .ad-slot{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ad-text{
    font-size:15px;
    font-weight:800;
    max-width:220px;
    text-align:center;
    animation:adFlash 1s infinite;
  }
  @keyframes adFlash{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.15; }
  }
  .title-row .title-center{
    flex:1 1 auto;
    min-width:180px;
  }
  .site-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:var(--primary-dark);
    margin:10px 0 4px;
  }
  .site-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:30px;
  }
  .link-grid{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    align-items:stretch;
    gap:16px;
    padding:0 30px 40px;
    width:100%;
  }
  @media (max-width:1000px){
    .link-grid{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (max-width:600px){
    .link-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .link-item{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .link-desc-box{
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-bottom:none;
    border-radius:10px 10px 0 0;
    padding:10px 12px;
    font-size:12.5px;
    color:#7c2d12;
    white-space:pre-line;
    min-height:20px;
    flex:1 1 auto;
  }
  .link-btn{
    display:block;
    text-align:center;
    color:#fff;
    text-decoration:none;
    padding:18px 8px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    transition:transform .15s, background .15s;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .link-item .link-btn{
    border-radius:0 0 10px 10px;
    margin-top:auto;
  }
  .link-item:not(:has(.link-desc-box)) .link-btn{
    border-radius:10px;
  }
  .link-btn:hover{
    transform:translateY(-2px);
    filter:brightness(0.92);
  }
  .empty-msg{
    color:var(--muted);
    text-align:center;
    padding:30px;
  }
  .hidden{display:none;}
</style>
</head>
<body>

<div class="title-row">
  <div class="ad-slot" id="leftAdSlot"></div>
  <div class="title-center">
    <div class="site-title" id="publicTitle">Website Title</div>
    <div class="site-subtitle" id="publicSubtitle"></div>
  </div>
  <div class="ad-slot" id="rightAdSlot"></div>
</div>
<div class="link-grid" id="publicLinkGrid"></div>
<div class="empty-msg hidden" id="emptyMsg">Abhi koi link add nahi hua hai. Admin Panel se link add karein.</div>

<script type="module">
// ---------- Firebase setup (live sync, no localStorage) ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSNf2tBRYLxLVH1Xj1oUef-aR4jd6uKBs",
  authDomain: "web-site-jan-seva-kendra.firebaseapp.com",
  projectId: "web-site-jan-seva-kendra",
  storageBucket: "web-site-jan-seva-kendra.firebasestorage.app",
  messagingSenderId: "750982902874",
  appId: "1:750982902874:web:f873c48856021ff3801463",
  measurementId: "G-4BLJ4DK435"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dataDocRef = doc(db, "sitePanel", "main");

function defaultData(){
  return {
    title: "Mera Website",
    subtitle: "Yahan se apne links access karein",
    links: [],
    buttonStyle: {
      bgColor: "#2563eb",
      textColor: "#ffffff",
      fontFamily: "'Segoe UI', Arial, sans-serif",
      fontSize: "15"
    },
    ads: {
      left: { text: "", color: "#dc2626" },
      right: { text: "", color: "#dc2626" }
    }
  };
}

let data = defaultData();

function ensureButtonStyle(){
  if(!data.buttonStyle){
    data.buttonStyle = {
      bgColor: "#2563eb",
      textColor: "#ffffff",
      fontFamily: "'Segoe UI', Arial, sans-serif",
      fontSize: "15"
    };
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Ads (Left / Right of title) ----------
function renderAdSlot(slotId, ad){
  const slot = document.getElementById(slotId);
  slot.innerHTML = "";
  if(!ad || !ad.text || ad.text.trim() === ""){ return; }
  const span = document.createElement('div');
  span.className = 'ad-text';
  span.textContent = ad.text;
  span.style.color = ad.color || '#dc2626';
  slot.appendChild(span);
}

function renderAds(){
  const ads = data.ads || { left:{}, right:{} };
  renderAdSlot('leftAdSlot', ads.left);
  renderAdSlot('rightAdSlot', ads.right);
}

// ---------- Public (Index) render ----------
function renderPublic(){
  renderAds();
  document.getElementById('publicTitle').textContent = data.title;
  document.getElementById('publicSubtitle').textContent = data.subtitle || "";
  const grid = document.getElementById('publicLinkGrid');
  const emptyMsg = document.getElementById('emptyMsg');
  grid.innerHTML = "";
  const links = data.links || [];
  if(links.length === 0){
    emptyMsg.classList.remove('hidden');
  } else {
    emptyMsg.classList.add('hidden');
    ensureButtonStyle();
    const st = data.buttonStyle;
    links.forEach(link => {
      const item = document.createElement('div');
      item.className = 'link-item';

      if(link.description && link.description.trim() !== ""){
        const box = document.createElement('div');
        box.className = 'link-desc-box';
        box.innerHTML = escapeHtml(link.description);
        item.appendChild(box);
      }

      const a = document.createElement('a');
      a.href = link.url;
      a.target = "_blank";
      a.className = "link-btn";
      a.textContent = link.name;
      a.style.background = link.bgColor || st.bgColor;
      a.style.color = link.textColor || st.textColor;
      a.style.fontFamily = st.fontFamily;
      a.style.fontSize = (st.fontSize || "15") + "px";
      item.appendChild(a);

      grid.appendChild(item);
    });
  }
}

// ---------- Live listener (auto-updates the moment Admin saves) ----------
onSnapshot(dataDocRef, (snap) => {
  if(snap.exists()){
    data = snap.data();
    renderPublic();
  }
}, (err) => {
  console.error("Firebase sync error:", err);
});

renderPublic();
</script>

</body>
</html>
